<script>

    // Mesin Haversine: Menghitung koordinat baru bergeser jarak (dalam meter)
    function hitungTitikBaru(lat, lon, distance, bearing) {
        const R = 6378137; // Radius bumi dalam meter
        const brng = bearing * Math.PI / 180;
        const lat1 = lat * Math.PI / 180;
        const lon1 = lon * Math.PI / 180;
        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distance/R) + Math.cos(lat1) * Math.sin(distance/R) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(distance/R) * Math.cos(lat1), Math.cos(distance/R) - Math.sin(lat1) * Math.sin(lat2));
        return { lat: lat2 * 180 / Math.PI, lon: lon2 * 180 / Math.PI };
    }

    // Format Tanggal ala Aplikasi GPS
    function formatTanggalGPS(dateObj) {
        const dd = String(dateObj.getDate()).padStart(2, '0');
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const yy = String(dateObj.getFullYear()).slice(-2);
        let hrs = dateObj.getHours();
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12; hrs = hrs ? hrs : 12; 
        const h = String(hrs).padStart(2, '0');
        const min = String(dateObj.getMinutes()).padStart(2, '0');
        return `${yy}/${mm}/${dd} ${h}:${min} ${ampm}`;
    }

    // Pembuat Teks Multi-baris pada Canvas
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = ''; let currentY = y;
        for(let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, currentY);
                line = words[n] + ' '; currentY += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line, x, currentY);
        return currentY + lineHeight; // Mengembalikan kursor Y terbaru
    }

    // ==========================================
    // HELPER TEMPLATE GPS MAP CAMERA
    // ==========================================
    function rr(ctx, x, y, w, h, r) {
        r = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    // Pin merah gaya Google Maps (ujung pin di x,y)
    function gambarPin(ctx, x, y, s) {
        ctx.save();
        ctx.fillStyle = '#EA4335';
        ctx.beginPath();
        ctx.moveTo(x - 0.20*s, y - 0.42*s);
        ctx.lineTo(x + 0.20*s, y - 0.42*s);
        ctx.lineTo(x, y);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y - 0.62*s, 0.34*s, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#A50E0E';
        ctx.beginPath();
        ctx.arc(x, y - 0.62*s, 0.14*s, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
    function latLonKeTile(lat, lon, z) {
        const n = Math.pow(2, z);
        const xt = (lon + 180) / 360 * n;
        const latRad = lat * Math.PI / 180;
        const yt = (1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * n;
        return {x: xt, y: yt};
    }
    function muatGambar(url) {
        return new Promise((resolve, reject) => {
            const im = new Image();
            im.crossOrigin = "anonymous";
            im.onload = () => resolve(im);
            im.onerror = reject;
            im.src = url;
        });
    }
    const _cachePeta = {};
    async function petaKotak(lat, lon) {
        const z = 16;
        const t = latLonKeTile(lat, lon, z);
        const tx0 = Math.floor(t.x) - 1, ty0 = Math.floor(t.y) - 1;
        const key = z + '/' + tx0 + '/' + ty0;
        if (_cachePeta[key]) return { c: _cachePeta[key], px: (t.x - tx0)*256, py: (t.y - ty0)*256 };
        const c = document.createElement('canvas');
        c.width = 768; c.height = 768;
        const cx = c.getContext('2d');
        cx.fillStyle = '#223322';
        cx.fillRect(0, 0, 768, 768);
        const jobs = [];
        for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) {
            jobs.push(muatGambar(`https://tile.openstreetmap.org/${z}/${tx0+dx}/${ty0+dy}.png`)
                .then(im => cx.drawImage(im, dx*256, dy*256))
                .catch(() => {}));
        }
        await Promise.all(jobs);
        _cachePeta[key] = c;
        return { c, px: (t.x - tx0)*256, py: (t.y - ty0)*256 };
    }
    async function gambarMiniMap(ctx, lat, lon, dx, dy, size, sc) {
        ctx.save();
        rr(ctx, dx, dy, size, size, 14*sc);
        ctx.clip();
        try {
            const r = await petaKotak(lat, lon);
            const crop = 420;
            let sx = Math.round(r.px - crop/2), sy = Math.round(r.py - crop/2);
            sx = Math.max(0, Math.min(768 - crop, sx));
            sy = Math.max(0, Math.min(768 - crop, sy));
            ctx.drawImage(r.c, sx, sy, crop, crop, dx, dy, size, size);
        } catch(e) {
            ctx.fillStyle = '#2f3b2f';
            ctx.fillRect(dx, dy, size, size);
        }
        gambarPin(ctx, dx + size/2, dy + size/2, size*0.30);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = Math.max(2, 4*sc);
        rr(ctx, dx, dy, size, size, 14*sc);
        ctx.stroke();
    }
    function gambarLogoBadge(ctx, W, barY, sc) {
        const h = 56*sc, pad = 18*sc;
        ctx.save();
        ctx.font = `bold ${27*sc}px Arial`;
        const tw = ctx.measureText('GPS Map Camera').width;
        const w = tw + 96*sc;
        const x = W - w - pad, y = barY - h - Math.round(14*sc);
        ctx.fillStyle = 'rgba(13,20,36,0.78)';
        rr(ctx, x, y, w, h, 14*sc);
        ctx.fill();
        const isz = 36*sc, ix = x + 13*sc, iy = y + (h - isz)/2;
        ctx.fillStyle = '#38bdf8';
        rr(ctx, ix, iy, isz, isz, 9*sc);
        ctx.fill();
        gambarPin(ctx, ix + isz/2, iy + isz*0.80, isz*0.66);
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.fillText('GPS Map Camera', ix + isz + 13*sc, y + h/2 + 1);
        ctx.restore();
    }
    function formatTanggalGPS2(d) {
        const dd = String(d.getDate()).padStart(2,'0');
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const yy = String(d.getFullYear()).slice(-2);
        let hrs = d.getHours();
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12 || 12;
        const off = -d.getTimezoneOffset();
        const sgn = off >= 0 ? '+' : '-';
        const oh = String(Math.floor(Math.abs(off)/60)).padStart(2,'0');
        const om = String(Math.abs(off)%60).padStart(2,'0');
        return `${dd}/${mm}/${yy} ${String(hrs).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ${ampm} GMT ${sgn}${oh}:${om}`;
    }

    // ==========================================
    // MESIN UTAMA: ONLINE FETCH & CANVAS RENDER
    // ==========================================
    async function jalankanBatchEngine() {
        const inputStrVal = document.getElementById('in-koordinat').value;
        if (!inputStrVal) return alert("Silakan isi Koordinat Awal terlebih dahulu!");

        const inputStr = inputStrVal.replace(/[^0-9.,-]/g, '');
        const parts = inputStr.split(',');
        if (parts.length < 2) return alert("Format Koordinat salah! Gunakan koma untuk pemisah Lat dan Lon.");
        
        let currentLat = parseFloat(parts[0]);
        let currentLon = parseFloat(parts[1]);
        
        const inputJumlah = document.getElementById('in-jumlah').value;
        const jmlFoto = inputJumlah ? parseInt(inputJumlah) : 50; // default 50 jika kosong

        const inputWaktu = document.getElementById('in-time').value;
        let currentTime = inputWaktu ? new Date(inputWaktu) : new Date(); // default sekarang jika kosong

        const fallbackAddress = document.getElementById('in-address-fallback').value || "Lokasi Cadangan Tidak Diisi";

        const btn = document.getElementById('btn-proses');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const resultsDiv = document.getElementById('results');
        
        btn.disabled = true;
        statusBox.style.display = 'block';
        statusBox.style.background = '#eff6ff';
        statusBox.style.color = '#1d4ed8';
        resultsDiv.innerHTML = '';

        let titleText = "Lokasi Tidak Diketahui, Indonesia";
        let addressText = fallbackAddress; 

        try {
            // TAHAP 1: REQUEST ONLINE KE SATELIT
            statusText.innerHTML = "Menghubungi satelit lokasi secara online...";
            
            try {
                const apiUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&addressdetails=1&email=kantor.notaris@gmail.com`;
                const geoCtrl = new AbortController();
                const geoTimer = setTimeout(() => geoCtrl.abort(), 8000); // timeout 8 detik -> pakai alamat manual
                let geoRes = null;
                try {
                    geoRes = await fetch(apiUrl, { headers: { 'Accept-Language': 'id-ID' }, signal: geoCtrl.signal });
                } catch (fetchErr) {
                    console.warn("Geocoding timeout/gagal, pakai alamat cadangan.");
                } finally {
                    clearTimeout(geoTimer);
                }
                
                if (geoRes && geoRes.ok) {
                    const geoData = await geoRes.json();
                    if(geoData && geoData.address) {
                        const adr = geoData.address;
                        const desa = adr.village || adr.neighbourhood || adr.hamlet || "";
                        const jalan = adr.road || adr.pedestrian || adr.path || "";
                        const kecamatanAsli = adr.city_district || adr.suburb || "";
                        const kabupatenAsli = adr.city || adr.county || "";
                        const provinsi = adr.state || "";
                        const kodepos = adr.postcode || "";

                        // Merakit Judul Cetak Tebal
                        let titleParts = [];
                        if (kecamatanAsli) titleParts.push(kecamatanAsli.startsWith('Kec') ? kecamatanAsli : 'Kecamatan ' + kecamatanAsli);
                        if (provinsi) titleParts.push(provinsi);
                        titleParts.push("Indonesia");
                        titleText = titleParts.join(", ");

                        // Merakit Alamat Detail (kecamatan dihilangkan — sudah ada di judul)
                        let addrArray = [];
                        if (jalan) addrArray.push(jalan);
                        if (desa) addrArray.push(desa);
                        if (kabupatenAsli) addrArray.push(kabupatenAsli.startsWith('Kab') ? kabupatenAsli : 'Kabupaten ' + kabupatenAsli);
                        if (provinsi) addrArray.push(kodepos ? `${provinsi} ${kodepos}` : provinsi);
                        addrArray.push("Indonesia");
                        
                        addressText = addrArray.join(", ");
                    }
                }
            } catch (osmError) {
                console.warn("Koneksi satelit gagal. Sistem mengaktifkan alamat cadangan.");
            }

            // TAHAP 2: BATCH PROCESSING KANVAS GAMBAR
            for (let i = 1; i <= jmlFoto; i++) {
                statusText.innerText = `Merender foto patok ke-${i} dari ${jmlFoto}...`;

                const img = new Image();
                img.crossOrigin = "anonymous";
                let isImageLoaded = false;
                
                // SISTEM FOTO ACAK (RANDOM SELECTION)
                // Mengambil foto secara acak dari 1.jpg sampai 39.jpg
                const totalFotoPatok = 39;
                const randomIndex = Math.floor(Math.random() * totalFotoPatok) + 1;
                img.src = `https://cdn.jsdelivr.net/gh/pmamediajogja-cyber/sistem-notaris@main/foto_patok/${randomIndex}.jpg`;
                
                try {
                    await new Promise((resolve, reject) => { 
                        img.onload = resolve; 
                        img.onerror = () => reject(new Error("Gambar tidak ditemukan")); 
                    });
                    isImageLoaded = true;
                } catch (e) {
                    // Jika gagal, coba lagi dengan foto lain secara acak
                    let percobaan = 0;
                    while (!isImageLoaded && percobaan < 5) {
                        const fallbackIndex = Math.floor(Math.random() * totalFotoPatok) + 1;
                        img.src = `https://cdn.jsdelivr.net/gh/pmamediajogja-cyber/sistem-notaris@main/foto_patok/${fallbackIndex}.jpg`;
                        try {
                            await new Promise((resolve, reject) => { 
                                img.onload = resolve; 
                                img.onerror = () => reject(new Error("Gambar tidak ditemukan")); 
                            });
                            isImageLoaded = true;
                        } catch (err) {
                            percobaan++;
                        }
                    }
                }

                if(!isImageLoaded) {
                    alert("Folder foto patok kosong / tidak dapat diakses!");
                    break;
                }

                // ==========================================
                // JARING PENGAMAN: PLUS CODE LIBRARY BYPASS
                // ==========================================
                let finalAddressText = addressText;
                try {
                    if (typeof OpenLocationCode !== 'undefined') {
                        const fullPlusCode = OpenLocationCode.encode(currentLat, currentLon, 10);
                        const shortPlusCode = fullPlusCode.substring(4); // Cth: 69FW+RQX
                        finalAddressText = `${shortPlusCode}, ${addressText}`;
                    } else {
                        console.warn("Library Plus Code gagal diunduh browser. Melanjutkan tanpa Plus Code.");
                    }
                } catch(err) {
                    console.warn("Gagal men-generate Plus Code", err);
                }

                // Render Canvas
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');

                // Efek Kamera Acak (Zoom & Geser)
                const zoomFactor = 1.0 + (Math.random() * 0.15);
                const newImgWidth = img.width * zoomFactor;
                const newImgHeight = img.height * zoomFactor;
                const offsetX = - (Math.random() * (newImgWidth - canvas.width));
                const offsetY = - (Math.random() * (newImgHeight - canvas.height));

                ctx.drawImage(img, offsetX, offsetY, newImgWidth, newImgHeight);

                const scale = canvas.width / 1080;

                // ==========================================
                // TEMPLATE GPS MAP CAMERA (mini map + logo + bar alamat)
                // ==========================================
                const barH = Math.round(canvas.height * 0.30);
                const barY = canvas.height - barH;
                const sT = Math.min(scale, barH / 300); // skala teks agar muat di bar

                // Bar alamat bawah (gelap transparan)
                ctx.fillStyle = 'rgba(18,18,18,0.74)';
                ctx.fillRect(0, barY, canvas.width, barH);
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.fillRect(0, barY, canvas.width, Math.max(2, 3 * sT));

                // Mini Map (OpenStreetMap) kiri bawah
                const mapSize = Math.round(Math.min(canvas.width * 0.235, barH - 44 * sT));
                const mapX = Math.round(22 * sT);
                const mapY = Math.round(canvas.height - mapSize - 22 * sT);
                await gambarMiniMap(ctx, currentLat, currentLon, mapX, mapY, mapSize, sT);

                // Teks alamat kanan mini map
                const tx = mapX + mapSize + Math.round(22 * sT);
                let ty = barY + Math.round(42 * sT);
                const maxW = canvas.width - tx - Math.round(22 * sT);
                ctx.fillStyle = '#ffffff';
                ctx.textBaseline = 'alphabetic';
                ctx.font = `bold ${30 * sT}px Arial`;
                ty = wrapText(ctx, titleText, tx, ty, maxW, 40 * sT);
                ty += 10 * sT;
                ctx.font = `${25 * sT}px Arial`;
                ty = wrapText(ctx, finalAddressText, tx, ty, maxW, 34 * sT);
                ty += 14 * sT;
                ctx.font = `bold ${25 * sT}px Arial`;
                ctx.fillText(`Lat ${currentLat.toFixed(6)}\u00B0`, tx, ty);
                ty += 36 * sT;
                ctx.fillText(`Long ${currentLon.toFixed(6)}\u00B0`, tx, ty);
                ty += 36 * sT;
                ctx.fillText(formatTanggalGPS2(currentTime), tx, ty);

                // Logo badge kanan bawah (di atas bar alamat)
                gambarLogoBadge(ctx, canvas.width, barY, scale);

                // ==========================================

                // Ekspor Data Gambar ke Layar UI
                const finalImageURL = canvas.toDataURL("image/jpeg", 0.95);
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <a href="${finalImageURL}" download="Patok_${i}.jpg" class="download-overlay" title="Download Foto"><i class="fa-solid fa-download"></i></a>
                    <img src="${finalImageURL}">
                    <div style="font-size: 11px; font-weight: bold; color: #475569;">Patok ${i}</div>
                    <div style="font-size: 10px; color: #94a3b8;">${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}</div>
                `;
                resultsDiv.appendChild(card);

                // ITERASI MATEMATIS UNTUK PATOK BERIKUTNYA (ARAH ACAK)
                const arahAcak = Math.random() * 360; // Menghasilkan arah acak 0-360 derajat
                const jarakPergeseran = 10; // Jarak patok 10 meter
                
                const nextCoord = hitungTitikBaru(currentLat, currentLon, jarakPergeseran, arahAcak); 
                currentLat = nextCoord.lat;
                currentLon = nextCoord.lon;
                
                // Penambahan menit acak (1-3 menit) per foto
                currentTime.setMinutes(currentTime.getMinutes() + Math.floor(Math.random() * 3) + 1); 
            }

            statusBox.style.background = '#ecfdf5';
            statusBox.style.borderColor = '#a7f3d0';
            statusBox.style.color = '#059669';
            statusText.innerHTML = "<b>Sukses!</b> Seluruh foto patok berhasil dirakit.";

            // Tampilkan tombol Download PDF
            document.getElementById('btn-download-pdf').style.display = 'flex';

        } catch (error) {
            console.error(error);
            alert("Terjadi kesalahan sistem internal. Pastikan foto 1.jpg tersedia di folder.");
        } finally {
            btn.disabled = false;
        }
    }

    // ==========================================
    // FITUR DOWNLOAD SEMUA PDF (LAPORAN BPN)
    // ==========================================
    async function downloadAllPDF() {
        const resultsDiv = document.getElementById('results');
        const cards = resultsDiv.querySelectorAll('.result-card img');
        
        if (cards.length === 0) {
            alert('Belum ada foto yang dirender! Klik tombol "Mulai" terlebih dahulu.');
            return;
        }

        const statusText = document.getElementById('status-text');
        const btnPdf = document.getElementById('btn-download-pdf');
        
        btnPdf.disabled = true;
        statusText.innerText = "Membuat PDF...";

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageWidth = 210;
        const margin = 15;
        const colGap = 10; 
        const rowGap = 20; 
        const boxWidth = (pageWidth - (margin * 2) - colGap) / 2;
        const boxHeight = 115;
        const startY = 30;

        const imageSources = Array.from(cards).map(img => img.src);

        for (let i = 0; i < imageSources.length; i++) {
            if (i % 4 === 0) {
                if (i !== 0) pdf.addPage();
                pdf.setFont("helvetica", "bold");
                pdf.setFontSize(16);
                pdf.text("DOKUMENTASI FOTO PATOK", pageWidth / 2, 20, { align: "center" });
            }

            const gridIndex = i % 4; 
            const col = gridIndex % 2; 
            const row = Math.floor(gridIndex / 2); 

            const frameX = margin + (col * (boxWidth + colGap));
            const frameY = startY + (row * (boxHeight + rowGap));

            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(12);
            pdf.text(`Foto Patok ${i + 1}`, frameX, frameY);

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imageSources[i];
            
            const imgData = await new Promise((resolve) => {
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve({
                        base64: canvas.toDataURL('image/jpeg', 0.8),
                        width: img.width,
                        height: img.height
                    });
                };
            });

            const scaleRatio = Math.min(boxWidth / imgData.width, boxHeight / imgData.height);
            const finalImgWidth = imgData.width * scaleRatio;
            const finalImgHeight = imgData.height * scaleRatio;

            const offsetX = frameX + ((boxWidth - finalImgWidth) / 2);
            const offsetY = frameY + 5 + ((boxHeight - finalImgHeight) / 2);

            pdf.addImage(imgData.base64, 'JPEG', offsetX, offsetY, finalImgWidth, finalImgHeight);
        }

        pdf.save('Laporan_Patok_BPN.pdf');
        statusText.innerText = "PDF berhasil diunduh!";
        btnPdf.disabled = false;
    }
</script>
