<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanda Terima Berkas — PMA Legal Ops</title><style>body{margin:0;background:#f5f5f3;color:#111;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:42px 20px 70px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 10px 30px #0000000a}.kicker{font-size:11px;letter-spacing:.14em;font-weight:800;color:#777}h1{font-size:32px;margin:7px 0}h2{font-size:22px;margin:6px 0}p{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:800;color:#444;margin-bottom:15px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d5d5d5;border-radius:10px;background:#fff;font:inherit;font-weight:500}.docs{border:1px solid #e5e5e5;border-radius:12px;padding:15px;margin:5px 0 16px}.check{display:flex;flex-direction:row;align-items:center;gap:9px;font-size:13px;font-weight:600;padding:8px 0}.check input{width:17px}.custom{display:flex;gap:10px}.custom input{flex:1}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.ghost{background:#eee}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#eee}.success{background:#e9f7ee}.danger{background:#faeaea}.history{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:12px;font-size:13px}.history span{color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:25px 14px}.history{flex-direction:column}}</style></head><body><main class="wrap"><section class="card"><span class="kicker">PMA LEGAL OPS / UTILITY</span><h1>Generator Tanda Terima Berkas</h1><p>Versi SaaS: tanda terima dikaitkan dengan perkara dan tenant melalui backend.</p></section><form id="form" class="card"><div class="grid"><label>Arah dokumen<select id="direction"><option value="incoming">Terima Masuk · Klien → Kantor</option><option value="outgoing">Serah Keluar · Kantor → Pihak Luar</option></select></label><label>Tanggal<input id="date" type="date" required></label></div><div class="grid"><label>Perkara<select id="matter" required><option value="">Pilih perkara...</option></select></label><label>Nama pihak lain<input id="party" maxlength="200" required placeholder="Nama klien / pihak penyerah"></label></div><label>Staff / Notaris<input id="staff" maxlength="200" placeholder="Nama internal kantor"></label><div class="docs"><strong>Dokumen yang diserahkan</strong><label class="check"><input type="checkbox" value="Asli Alas Hak (Sertifikat / Letter C)">Asli Alas Hak (Sertifikat / Letter C)</label><label class="check"><input type="checkbox" value="Asli Salinan Akta Jual Beli (AJB)">Asli Salinan AJB</label><label class="check"><input type="checkbox" value="Asli Sertifikat Hak Tanggungan">Asli Sertifikat Hak Tanggungan</label><label class="check"><input type="checkbox" value="Asli Surat Roya / Fiat Roya">Asli Surat Roya / Fiat Roya</label><label class="check"><input type="checkbox" value="Asli SPPT PBB">Asli SPPT PBB</label><label class="check"><input type="checkbox" value="Asli STTS PBB (Bukti Lunas)">Asli STTS PBB (Bukti Lunas)</label><label class="check"><input type="checkbox" value="Fotocopy KTP & KK">Fotocopy KTP & KK</label><div class="custom"><input id="custom" maxlength="500" placeholder="Tambah dokumen lain..."><button type="button" class="btn ghost" id="add">+ Tambah</button></div></div><div id="msg"></div><button class="btn primary" id="save">Simpan Tanda Terima</button></form><section class="card"><span class="kicker">AUDIT TRAIL</span><h2>Riwayat Tanda Terima</h2><button class="btn ghost" id="reload">Muat riwayat</button><div id="history"><p>Belum dimuat.</p></div></section></main><script>const API=(location.hostname==='pma.wtf'&&'/notary-api/')||'/notary-api/';let csrf=null;const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);async function req(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt,headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',...(csrf?{'X-CSRF-Token':csrf}:{})}});const j=await r.json().catch(()=>({status:'error',pesan:'Respons server tidak valid'}));if(j.csrf_token)csrf=j.csrf_token;if(!r.ok||j.status==='error')throw Error(j.pesan||'Permintaan gagal');return j}function body(v){const b=new URLSearchParams;Object.entries(v).forEach(([k,x])=>b.set(k,String(x)));return b}async function loadMatter(){try{const r=await req('api_matters.php?action=list');const list=r.data||r.matters||[];$('matter').innerHTML='<option value="">Pilih perkara...</option>'+list.map(m=>`<option value="${m.id}">${m.matter_code||m.id} · ${m.title||m.service_type||''}</option>`).join('')}catch(e){$('matter').innerHTML='<option value="">Gagal memuat perkara — login server dulu</option>'}}async function history(){try{const r=await req('api_document_receipts.php?action=list');$('history').innerHTML=(r.data||[]).map(x=>`<div class="history"><strong>${x.id}</strong><span>${x.counterparty_name} · ${x.direction} · ${x.receipt_date}</span></div>`).join('')||'<p>Belum ada tanda terima.</p>'}catch(e){$('history').innerHTML='<p>'+e.message+'</p>'}}$('add').onclick=()=>{const v=$('custom').value.trim();if(!v)return;const l=document.createElement('label');l.className='check';l.innerHTML='<input type="checkbox">';l.querySelector('input').value=v;l.append(document.createTextNode(v));$('custom').value='';document.querySelector('.docs').insertBefore(l,document.querySelector('.custom'))};$('form').onsubmit=async e=>{e.preventDefault();const selected=[...document.querySelectorAll('.check input:checked')].map(x=>({description:x.value,quantity:1}));if(!selected.length){$('msg').className='msg danger';$('msg').textContent='Pilih minimal satu dokumen.';return}$('save').disabled=true;try{const r=await req('api_document_receipts.php?action=create',{method:'POST',body:body({matter_id:$('matter').value,direction:$('direction').value,counterparty_name:$('party').value.trim(),receipt_date:$('date').value,staff_name:$('staff').value.trim(),items:JSON.stringify(selected)})});$('msg').className='msg success';$('msg').textContent='Tersimpan. ID tanda terima: '+r.receipt_id;history()}catch(err){$('msg').className='msg danger';$('msg').textContent=err.message}finally{$('save').disabled=false}};$('reload').onclick=history;loadMatter();history();</script></body></html>
